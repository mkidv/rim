name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  checks: write

jobs:
  check:
    name: Check & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check Workspace
        run: cargo check --workspace --all-targets --all-features
      - name: Security Audit
        uses: actions-rust-lang/audit@v1
        with:
          denyWarnings: false

  test:
    name: Test Suite (${{ matrix.os }})
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Tests
        run: cargo test --workspace --all-features

  lint:
    name: Lints & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Rustfmt Check
        run: cargo fmt --all -- --check
      - name: Clippy Check
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tarpaulin
        run: |
          cargo install cargo-tarpaulin --locked || true
      - name: Generate Coverage
        run: cargo tarpaulin --verbose --all-features --workspace --timeout 180 --out Xml
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  integrity:
    name: Image Integrity & Native fsck Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Filesystem Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools exfatprogs e2fsprogs ntfs-3g fdisk util-linux

      - name: Build rimcli (Release)
        run: cargo build --release -p rimcli

      - name: Test CLI Inspection & Generation (ESP)
        run: |
          ./target/release/rim generate examples/esp-boot.toml --output test_esp.img
          ./target/release/rim inspect test_esp.img
          ./target/release/rim check test_esp.img --verbose
          ./target/release/rim convert test_esp.img test_esp.qcow2
          ./target/release/rim inspect test_esp.qcow2

      - name: Test Multi-FS Image Generation
        run: |
          ./target/release/rim generate examples/multi-fs-vm.toml --output test_multifs.img
          ./target/release/rim inspect test_multifs.img
          ./target/release/rim check test_multifs.img --verbose

      - name: Verify Partitions with Linux Kernel & fsck Tools
        run: |
          # Attach loop device with partition scanning (-P)
          sudo losetup -P -f test_multifs.img
          LOOPDEV=$(losetup -j test_multifs.img | cut -d: -f1)
          echo "Attached to $LOOPDEV"
          ls -la ${LOOPDEV}*

          # Partition 1: EFI / FAT32
          echo ">>> Checking p1 (FAT32)..."
          sudo fsck.vfat -v -n ${LOOPDEV}p1

          # Partition 2: Linux Root / EXT4
          echo ">>> Checking p2 (EXT4)..."
          sudo e2fsck -n -f ${LOOPDEV}p2

          # Partition 3: Shared Data / ExFAT
          echo ">>> Checking p3 (ExFAT)..."
          sudo fsck.exfat -n ${LOOPDEV}p3

          # Partition 4: Windows Data / NTFS
          echo ">>> Checking p4 (NTFS)..."
          sudo ntfsfix -n ${LOOPDEV}p4

          echo ">>> All Native Linux Kernel & fsck Integrity Checks Passed!"

          # Detach loop device
          sudo losetup -d $LOOPDEV
