[package]
name = "rimfs-tar"
description = "TAR archive filesystem driver for rim (formatter, injector, resolver, checker)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
alloc = ["rimfs-core/alloc", "rimio/alloc"]
std = ["alloc", "rimfs-core/std", "rimio/std"]

[dependencies]
rimfs-core = { path = "../rimfs-core", version = "0.8.1", default-features = false }
rimio = { path = "../rimio", version = "0.8.1", default-features = false }

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }
rimfs-core = { path = "../rimfs-core", version = "0.8.1", default-features = false, features = ["test-utils"] }
rimio = { path = "../rimio", version = "0.8.1", features = ["mmap", "std"] }
tempfile = "3.20.0"

[[bench]]
name = "tar_bench"
harness = false

[lints]
workspace = true
