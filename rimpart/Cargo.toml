[package]
name = "rimpart"
description = "Partition management for rim"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
alloc = ["rimio/alloc"]
mem = ["alloc"]
std = ["alloc", "rimio/std"]


[dependencies]
crc32fast = { version = "1.4.2", default-features = false }
paste = "1.0.15"
rimio = { path = "../rimio", version = "0.9.1", default-features = false }
zerocopy = { version = "0.8.25", default-features = false, features = [
    "derive",
] }

[dev-dependencies]
rimio = { path = "../rimio", default-features = false, features = ["mem"] }
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "gpt_crc_stream_bench"
harness = false

[lints]
workspace = true

