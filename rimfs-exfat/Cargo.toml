[package]
name = "rimfs-exfat"
description = "ExFAT filesystem implementation for rim"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
alloc = ["rimio/alloc", "rimfs-core/alloc"]
mem = ["alloc"]
std = ["alloc", "rimio/std", "crc32fast/std", "time/std", "rimfs-core/std"]

[dependencies]
bitflags = "2.9.1"
crc32fast = { version = "1.4.2", default-features = false }
rimio = { path = "../rimio", version = "0.8.2", default-features = false }
rimfs-core = { path = "../rimfs-core", version = "0.8.2", default-features = false }
time = { version = "0.3.41", default-features = false }
zerocopy = { version = "0.8.25", default-features = false, features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }
rimfs-core = { path = "../rimfs-core", version = "0.8.2", default-features = false, features = ["test-utils"] }
rimio = { path = "../rimio", version = "0.8.2", features = ["mmap", "std"] }
tempfile = "3.20.0"

[[bench]]
name = "exfat_bench"
harness = false

[package.metadata.docs.rs]
features = ["std"]

[lints]
workspace = true
