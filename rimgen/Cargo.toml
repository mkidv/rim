[package]
name = "rimgen"
description = "Declarative disk image generation engine for rim"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "rimgen"
path = "src/lib.rs"

[features]
default = ["std", "fat", "exfat", "ext", "ntfs"]
fat = ["rimfs/fat"]
exfat = ["rimfs/exfat"]
ext = ["rimfs/ext"]
ntfs = ["rimfs/ntfs"]
alloc = [
    "rimio/alloc",
    "rimpart/alloc",
    "rimfs/alloc",
    "serde/alloc",
]
std = [
    "alloc",
    "rimio/std",
    "rimpart/std",
    "rimfs/std",
    "serde/std",
    "uuid/std",
    "uuid/v4",
    "dep:tempfile",
    "dep:toml",
    "dep:rimimg",
]

[dependencies]
rimfs.workspace = true
rimio.workspace = true
rimpart.workspace = true
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
uuid = { version = "1.17.0", default-features = false, features = ["serde"] }

# Host / std only
rimimg = { workspace = true, optional = true }
tempfile = { version = "3.20.0", optional = true }
toml = { version = "0.9.7", optional = true }

[lints]
workspace = true

