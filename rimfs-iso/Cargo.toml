[package]
name = "rimfs-iso"
description = "ISO 9660, Joliet, Rock Ridge, and El Torito optical/hybrid filesystem driver for rim"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
alloc = ["rimfs-core/alloc", "rimio/alloc", "rimfs-fat/alloc"]
std = ["alloc", "rimfs-core/std", "rimio/std", "rimfs-fat/std"]

[dependencies]
rimfs-core = { path = "../rimfs-core", version = "0.9.0", default-features = false }
rimfs-fat = { path = "../rimfs-fat", version = "0.9.0", default-features = false }
rimio = { path = "../rimio", version = "0.9.0", default-features = false }
time = { version = "0.3", default-features = false }

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }
rimfs-core = { path = "../rimfs-core", version = "0.9.0", default-features = false, features = ["test-utils"] }
rimio = { path = "../rimio", version = "0.9.0", features = ["mmap", "std"] }
tempfile = "3.20.0"

[[bench]]
name = "iso_bench"
harness = false

[lints]
workspace = true
